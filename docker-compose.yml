services:
  mariadb:
    image: mariadb:lts
    container_name: ticketing-mariadb
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: ticketing_db
      MARIADB_USER: appuser
      MARIADB_PASSWORD: apppassword
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: ticketing-adminer
    restart: unless-stopped
    ports:
      - "8888:8080"
    depends_on:
      - mariadb

volumes:
  mariadb_data:
